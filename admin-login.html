<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1220;
      color: #e9eef9;
    }

    .wrap {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #121b2e;
      border: 1px solid rgba(255, 255, 255, .08);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 12px 30px rgba(0, 0, 0, .35);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    .sub {
      margin: 0 0 18px;
      opacity: .8;
      font-size: 13px;
    }

    label {
      display: block;
      margin: 10px 0 6px;
      font-size: 13px;
      opacity: .9;
    }

    input {
      width: 100%;
      padding: 11px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, .10);
      background: #0f172a;
      color: #e9eef9;
      outline: none;
    }

    input:focus {
      border-color: rgba(99, 102, 241, .7);
    }

    button {
      width: 100%;
      margin-top: 14px;
      padding: 11px 12px;
      border: 0;
      border-radius: 10px;
      background: #6366f1;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    button:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .error {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(239, 68, 68, .15);
      border: 1px solid rgba(239, 68, 68, .35);
      color: #fecaca;
      font-size: 13px;
      display: none;
      white-space: pre-wrap;
    }

    .hint {
      margin-top: 14px;
      opacity: .7;
      font-size: 12px;
      line-height: 1.5;
    }

    .row {
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .row button.secondary {
      background: #24314f;
      font-weight: 600;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <div class="card">
      <h1>Admin Login</h1>
      <p class="sub">Sign in to continue</p>
      <form id="loginForm">
        <label>Email / Phone</label>
        <input id="emailOrPhone" type="text" placeholder="yaman@example.com" required />

        <label>Password</label>
        <input id="password" type="password" placeholder="••••••••" required />

        <button id="btnLogin" type="submit">Login</button>
        <div class="row">
          <button class="secondary" type="button" id="btnClear">Clear</button>
          <button class="secondary" type="button" id="btnGoDashboard">Go Dashboard</button>
        </div>
        <div id="errorBox" class="error"></div>
      </form>
    </div>
  </div>

  <script>

    const API_URL = "http://yamankassab-001-site1.mtempurl.com/api/User/login";
    const TOKEN_KEY = "token";
    const REDIRECT_AFTER_LOGIN = "admin-dashboard.html";


    function setLoading(isLoading) {
      const btn = document.getElementById("btnLogin");
      btn.disabled = isLoading;
      btn.textContent = isLoading ? "Logging in..." : "Login";
    }
    function showError(msg) {
      const box = document.getElementById("errorBox");
      box.style.display = "block";
      box.textContent = msg;
    }
    function clearError() {
      const box = document.getElementById("errorBox");
      box.style.display = "none";
      box.textContent = "";
    }

    function saveToken(token) {
      localStorage.setItem(TOKEN_KEY, token);
    }
    function getToken() {
      return localStorage.getItem(TOKEN_KEY);
    }

    async function doLogin(emailOrPhone, password) {
      const payload = { emailOrPhone, password };
      const resp = await fetch(API_URL, {
        method: "POST",
        headers: {
          "Accept": "application/json",
          "Content-Type": "application/json"
        },
        body: JSON.stringify(payload)
      });
      const contentType = resp.headers.get("content-type") || "";
      const data = contentType.includes("application/json")
        ? await resp.json()
        : await resp.text();
      if (!resp.ok) {
        const msg = typeof data === "string" ? data : (data?.message || JSON.stringify(data));
        throw new Error(msg);
      }
      const token =
        data?.token ||
        data?.Token ||
        data?.accessToken ||
        data?.jwt ||
        data?.jwtToken ||
        data?.data?.token ||
        data?.data?.accessToken;

      if (!token) {
        throw new Error("Login succeeded but token was not found in response.\nResponse:\n" + JSON.stringify(data, null, 2));
      }

      return token;
    }

    document.getElementById("loginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      clearError();
      setLoading(true);

      const emailOrPhone = document.getElementById("emailOrPhone").value.trim();
      const password = document.getElementById("password").value;

      try {
        const token = await doLogin(emailOrPhone, password);
        saveToken(token);
        window.location.href = REDIRECT_AFTER_LOGIN;
      } catch (err) {
        showError(err?.message || "Login failed.");
      } finally {
        setLoading(false);
      }
    });


    document.getElementById("btnClear").addEventListener("click", () => {
      document.getElementById("emailOrPhone").value = "";
      document.getElementById("password").value = "";
      clearError();
    });
    document.getElementById("btnGoDashboard").addEventListener("click", () => {
      const token = getToken();
      if (!token) {
        showError("No token found. Please login first.");
        return;
      }
      window.location.href = REDIRECT_AFTER_LOGIN;
    });


  </script>
</body>

</html>
